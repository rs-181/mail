<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Rinix Mail</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico">
<style>
  :root{--brand-dark:#0F172A;--accent-blue:#0284C7;--accent-violet:#6366F1;--bg:#F8FAFC;--text-muted:#64748B}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--brand-dark);text-align:center;padding:24px;
  }
  .mark{
    width:52px;height:52px;border-radius:14px;margin-bottom:20px;
    background:linear-gradient(135deg,var(--accent-blue),var(--accent-violet));
  }
  h1{font-size:1.6rem;margin:0 0 8px}
  p{color:var(--text-muted);margin:0 0 20px;max-width:40ch}
  a{
    display:inline-block;background:var(--brand-dark);color:#fff;text-decoration:none;
    padding:10px 20px;border-radius:8px;font-weight:600;font-size:.9rem;
  }
</style>
</head>
<body>
  <div class="mark" aria-hidden="true"></div>
  <h1>This page doesn't exist</h1>
  <p>The address you followed may be broken, or the page may have moved. Head back to your inbox.</p>
  <a href="/">Return to Rinix Mail</a>
</body>
</html>
